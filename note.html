<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Note</title>
  <style>
    body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
    .card{width:min(720px,96vw);background:#141414;border:1px solid #2a2a2a;border-radius:18px;padding:16px}
    h1{margin:0 0 10px 0;font-size:20px}
    textarea{
      width:100%;height:65vh;margin-top:8px;border-radius:14px;border:1px solid #2f2f2f;
      background:#111;color:#fff;padding:12px;font-size:16px;line-height:1.35
    }
    .row{display:flex;gap:10px;margin-top:12px}
    .btn{
      flex:1;padding:14px 12px;border-radius:14px;border:1px solid #2f2f2f;
      background:#0f0f0f;color:#fff;font-weight:900;font-size:16px
    }
    .msg{margin-top:10px;color:#aaa;font-weight:800;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>📝 Note (foglio bianco)</h1>
      <textarea id="t" spellcheck="false" placeholder="Scrivi liberamente..."></textarea>
      <div class="row">
        <button class="btn" id="load">RICARICA</button>
        <button class="btn" id="save">SALVA</button>
      </div>
      <div class="msg" id="m"></div>
    </div>
  </div>

<script>
/*** CONFIG: cambia questi 2 valori ***/
const OWNER = "fabiuzcalendar";
const REPO  = "calendario-Fabiuz";
const BRANCH = "main";
const FILE_PATH = "notes.txt";

/*** TOKEN (riusa lo stesso di eventi) ***/
const TOKEN_KEY = "cal_token_v1";
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ""; }
function ensureToken(){
  let t = getToken();
  if (t) return t;
  t = prompt("Incolla il token GitHub (salvato SOLO su questo telefono):");
  if (!t) throw new Error("Token mancante.");
  localStorage.setItem(TOKEN_KEY, t.trim());
  return t.trim();
}

const t = document.getElementById("t");
const m = document.getElementById("m");
const msg = (s) => m.textContent = s || "";

async function ghGetText(){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${encodeURIComponent(BRANCH)}`;
  const res = await fetch(url, {
    headers: { "Accept":"application/vnd.github+json", "Authorization": `Bearer ${ensureToken()}` }
  });
  if (!res.ok) throw new Error(`GET failed: HTTP ${res.status}`);
  const data = await res.json();
  const content = atob(data.content.replace(/\n/g,""));
  return { text: decodeURIComponent(escape(content)), sha: data.sha };
}

async function ghPutText(text, sha){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
  const body = {
    message: `Update notes ${new Date().toISOString()}`,
    content: btoa(unescape(encodeURIComponent(text || ""))),
    branch: BRANCH,
    sha
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json",
      "Authorization": `Bearer ${ensureToken()}`
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`PUT failed: HTTP ${res.status}`);
}

async function load(){
  msg("Carico...");
  const { text } = await ghGetText();
  t.value = text || "";
  msg("✅ Caricato");
}

async function save(){
  msg("Salvo...");
  const { sha } = await ghGetText();
  await ghPutText(t.value, sha);
  msg("✅ Salvato");
}

document.getElementById("load").addEventListener("click", ()=>load().catch(e=>msg("❌ "+e.message)));
document.getElementById("save").addEventListener("click", ()=>save().catch(e=>msg("❌ "+e.message)));

load();
</script>
</body>
</html>
