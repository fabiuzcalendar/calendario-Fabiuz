<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calendario Fabio - Menu</title>

  <style>
    body{
      margin:0;
      font-family:system-ui;
      background:#0b0b0b;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .card{
      width:min(420px,92vw);
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    h1{
      text-align:center;
      font-size:22px;
      margin-bottom:10px;
    }

    .btn{
      padding:20px;
      font-size:18px;
      font-weight:900;
      border-radius:18px;
      border:1px solid #2a2a2a;
      background:#141414;
      color:#fff;
      cursor:pointer;
    }

    .btn:active{
      transform:scale(.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>📅 Calendario Fabio</h1>

    <button class="btn" onclick="go('note.html')">
      📝 Note / Lista spesa
    </button>

    <button class="btn" onclick="go('eventi.html')">
      ➕ Aggiungi evento
    </button>

    <button class="btn" onclick="go('index.html')">
      👁 Visualizza calendario
    </button>
  </div>

<script>
function go(p){
  window.location.href = p;
}
</script>

</body>
</html>
