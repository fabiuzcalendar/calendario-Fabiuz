<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eventi</title>
  <style>
    body{margin:0;font-family:system-ui;background:#0b0b0b;color:#fff}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
    .card{width:min(520px,96vw);background:#141414;border:1px solid #2a2a2a;border-radius:18px;padding:16px}
    h1{margin:0 0 10px 0;font-size:20px}
    label{display:block;margin-top:10px;color:#aaa;font-weight:800;font-size:13px}
    input,textarea{
      width:100%;margin-top:6px;border-radius:14px;border:1px solid #2f2f2f;
      background:#111;color:#fff;padding:12px;font-size:16px
    }
    textarea{height:140px}
    .row{display:flex;gap:10px;margin-top:12px}
    .btn{
      flex:1;padding:14px 12px;border-radius:14px;border:1px solid #2f2f2f;
      background:#0f0f0f;color:#fff;font-weight:900;font-size:16px
    }
    .msg{margin-top:10px;color:#aaa;font-weight:800;white-space:pre-wrap}
    .small{font-size:12px;color:#888;margin-top:10px;line-height:1.35}

    .list-wrap{
      margin-top:14px;
      border:1px solid #2f2f2f;
      border-radius:14px;
      background:#111;
      padding:10px;
    }
    .list-title{
      font-size:13px;
      font-weight:800;
      color:#aaa;
      margin-bottom:8px;
    }
    .event-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .event-item{
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.06);
      font-size:16px;
      cursor:pointer;
      user-select:none;
    }
    .event-item:hover{
      background:rgba(255,255,255,0.10);
    }
    .empty{
      color:#777;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>➕ Aggiungi evento</h1>

      <label>Data</label>
      <input id="date" type="date" />

      <label>Nota</label>
      <textarea id="text" spellcheck="false" placeholder="Es: Dentista 15:30"></textarea>

      <div class="row">
        <button class="btn" id="save">SALVA</button>
      </div>

      <div class="list-wrap">
        <div class="list-title">Eventi del giorno selezionato (tocca una riga per eliminarla)</div>
        <div id="event-list" class="event-list"></div>
      </div>

      <div class="msg" id="msg"></div>
      <div class="small">Il token GitHub viene salvato SOLO su questo telefono.</div>
    </div>
  </div>

<script>
const OWNER = "fabiuzcalendar";
const REPO  = "calendario-Fabiuz";
const BRANCH = "main";
const FILE_PATH = "events.json";

/*** TOKEN ***/
const TOKEN_KEY = "cal_token_v1";
function getToken(){ return localStorage.getItem(TOKEN_KEY) || ""; }
function ensureToken(){
  let t = getToken();
  if (t) return t;
  t = prompt("Incolla il token GitHub (salvato SOLO su questo telefono):");
  if (!t) throw new Error("Token mancante.");
  localStorage.setItem(TOKEN_KEY, t.trim());
  return t.trim();
}

const $ = (id) => document.getElementById(id);
const msg = (s) => { $("msg").textContent = s || ""; };

function isoToday(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function normalizeEventsJson(json){
  const out = {};
  if (!json || typeof json !== "object") return out;

  for (const [date, value] of Object.entries(json)) {
    if (Array.isArray(value)) {
      out[date] = value.filter(v => typeof v === "string" && v.trim()).map(v => v.trim());
    } else if (value && typeof value === "object" && typeof value.text === "string") {
      out[date] = [value.text.trim()].filter(Boolean);
    } else if (typeof value === "string" && value.trim()) {
      out[date] = [value.trim()];
    }
  }
  return out;
}

async function ghGetJson(){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${encodeURIComponent(BRANCH)}`;
  const res = await fetch(url, {
    headers: {
      "Accept":"application/vnd.github+json",
      "Authorization": `Bearer ${ensureToken()}`
    }
  });
  if (!res.ok) throw new Error(`GET failed: HTTP ${res.status}`);
  const data = await res.json();
  const content = atob((data.content || "").replace(/\n/g,""));
  const parsed = JSON.parse(content || "{}");
  return { json: normalizeEventsJson(parsed), sha: data.sha };
}

async function ghPutJson(newObj, sha){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
  const body = {
    message: `Update events ${new Date().toISOString()}`,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(newObj, null, 2)))),
    branch: BRANCH,
    sha
  };

  const res = await fetch(url, {
    method: "PUT",
    headers: {
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json",
      "Authorization": `Bearer ${ensureToken()}`
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const t = await res.text().catch(()=> "");
    throw new Error(`PUT failed: HTTP ${res.status}\n${t}`);
  }
  return await res.json();
}

async function renderEventList(){
  const date = $("date").value;
  const list = $("event-list");
  if (!date) {
    list.innerHTML = `<div class="empty">Seleziona una data.</div>`;
    return;
  }

  try{
    const { json } = await ghGetJson();
    const items = json[date] || [];

    list.innerHTML = "";
    if (!items.length) {
      list.innerHTML = `<div class="empty">Nessun evento per questa data.</div>`;
      return;
    }

    items.forEach((text, idx) => {
      const div = document.createElement("div");
      div.className = "event-item";
      div.textContent = text;
      div.title = "Tocca per eliminare";
      div.addEventListener("click", () => deleteEventAt(date, idx));
      list.appendChild(div);
    });
  }catch(e){
    list.innerHTML = `<div class="empty">Errore nel caricamento.</div>`;
  }
}

async function saveEvent(){
  const date = $("date").value;
  const text = $("text").value.trim();

  if (!date) return msg("⚠️ Scegli una data.");
  if (!text) return msg("⚠️ Scrivi una nota.");

  msg("Salvo...");
  const { json, sha } = await ghGetJson();

  if (!Array.isArray(json[date])) json[date] = [];
  json[date].push(text);

  await ghPutJson(json, sha);

  msg("✅ Salvato");
  $("text").value = "";
  await renderEventList();
}

async function deleteEventAt(date, idx){
  try{
    msg("Elimino...");
    const { json, sha } = await ghGetJson();

    if (!Array.isArray(json[date])) {
      msg("⚠️ Nessun evento da eliminare.");
      return;
    }

    json[date].splice(idx, 1);

    if (json[date].length === 0) {
      delete json[date];
    }

    await ghPutJson(json, sha);
    msg("✅ Eliminato");
    await renderEventList();
  }catch(e){
    msg("❌ " + e.message);
  }
}

$("date").value = isoToday();
$("save").addEventListener("click", () => saveEvent().catch(e=>msg("❌ "+e.message)));
$("date").addEventListener("change", () => renderEventList());

renderEventList();
</script>
</body>
</html>
